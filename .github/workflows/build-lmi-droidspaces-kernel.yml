name: Build lmi Droidspaces Kernel

# 用途：为 Redmi K30 Pro (lmi) 构建带 Droidspaces 容器支持的 4.19 内核（MIUI 目标）
# 触发方式：推送 kernel-lmi 分支，或手动 Run workflow
# 说明：本仓库仅作 CI 宿主，真正的源码来自两个公开上游仓库，构建过程不改动本仓库任何内容

on:
  push:
    branches:
      - kernel-lmi
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build lmi | KSU:true | OS:miui
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Droidspaces patches
        uses: actions/checkout@v7
        with:
          repository: 12begin/android_kernel_Droidspaces_xiaomi_sm8250
          ref: main
          fetch-depth: 1
          path: patches

      - name: Checkout kernel source (base repo)
        uses: actions/checkout@v7
        with:
          repository: 12begin/android_kernel_xiaomi_sm8250
          ref: android16-aptusitu-new
          fetch-depth: 1
          path: kernel

      - name: Apply Droidspaces patches
        run: |
          cd kernel
          cp -a ../patches/build_kernel.sh .
          cp -a ../patches/droidspaces.config .
          cp -a ../patches/fix_restore_cgroup_file_prefix_handling.cocci .
          cp -a ../patches/fix_kernel_panic_in_xt_qtaguid.cocci .
          cp -a ../patches/kernel/cgroup/cgroup.c kernel/cgroup/cgroup.c
          cp -a ../patches/drivers/bus/mhi/core/mhi_init.c drivers/bus/mhi/core/mhi_init.c
          cp -a ../patches/drivers/input/keyboard/nanosic_driver_v2/nano_macro.h drivers/input/keyboard/nanosic_driver_v2/nano_macro.h

          # ---- sanity checks: 提前失败，避免白跑一次编译 ----
          test -f arch/arm64/configs/lmi_defconfig || { echo "FAIL: lmi_defconfig missing"; exit 1; }
          grep -q -- '-e MILLET' build_kernel.sh || { echo "FAIL: build_kernel.sh 版本不符"; exit 1; }
          grep -q 'Guard against NULL' drivers/bus/mhi/core/mhi_init.c || { echo "FAIL: mhi fix missing"; exit 1; }
          grep -q 'CGRP_ROOT_NOPREFIX' kernel/cgroup/cgroup.c || { echo "FAIL: cgroup fix missing"; exit 1; }
          grep -q 'rawdata_show' drivers/input/keyboard/nanosic_driver_v2/nano_macro.h || { echo "FAIL: nano_macro.h missing"; exit 1; }
          grep -q '^CONFIG_PID_NS=y' droidspaces.config || { echo "FAIL: droidspaces.config missing CONFIG_PID_NS"; exit 1; }
          grep -q '^CONFIG_USER_NS=y' droidspaces.config || { echo "FAIL: droidspaces.config missing CONFIG_USER_NS"; exit 1; }
          grep -q 'kernfs_create_link' fix_restore_cgroup_file_prefix_handling.cocci || { echo "FAIL: cgroup cocci fix missing"; exit 1; }
          # lmi_defconfig 现状确认：PID_NS 未开启属预期，靠 droidspaces.config 合并补齐
          grep -c 'CONFIG_PID_NS' arch/arm64/configs/lmi_defconfig || true
          echo "[+] All patches verified OK"

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
            git gnupg gperf imagemagick libncurses-dev \
            lib32readline-dev lib32z1-dev liblz4-tool \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3 coccinelle

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache_mikernel
          key: ${{ runner.os }}-kernel-ccache-lmi-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-lmi-
            ${{ runner.os }}-kernel-ccache-

      - name: Setup zyc-clang 16 Toolchain
        run: |
          mkdir -p $HOME/zyc-clang
          cd $HOME/zyc-clang
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
          tar -zxvf Clang-16.0.6-20260510.tar.gz

      - name: Run Build Script
        working-directory: kernel
        run: |
          chmod +x build_kernel.sh
          echo "Executing: ./build_kernel.sh lmi ksu miui"
          ./build_kernel.sh lmi ksu miui

      - name: Show build outputs
        if: always()
        run: |
          echo "--- APTKernel zip ---"
          ls -lh kernel/APTKernel_*.zip 2>/dev/null || echo "(no zip produced)"

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: APTKernel-lmi-miui-${{ github.run_id }}
          path: kernel/APTKernel_*.zip
          compression-level: 0
          retention-days: 30
