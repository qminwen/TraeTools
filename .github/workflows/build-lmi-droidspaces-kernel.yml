name: Build lmi Droidspaces Kernel

# 用途：为 Redmi K30 Pro (lmi) 构建带 Droidspaces 容器支持的 4.19 内核（MIUI 目标）
# 触发方式：推送 kernel-lmi 分支，或手动 Run workflow
# 说明：本仓库仅作 CI 宿主，真正的源码来自两个公开上游仓库，构建过程不改动本仓库任何内容

on:
  push:
    branches:
      - kernel-lmi
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build lmi | KSU:false (keep Magisk) | OS:miui
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Droidspaces patches
        uses: actions/checkout@v7
        with:
          repository: 12begin/android_kernel_Droidspaces_xiaomi_sm8250
          ref: main
          fetch-depth: 1
          path: patches

      - name: Checkout kernel source (base repo)
        uses: actions/checkout@v7
        with:
          repository: 12begin/android_kernel_xiaomi_sm8250
          ref: android16-aptusitu-new
          fetch-depth: 1
          path: kernel

      - name: Apply Droidspaces patches
        run: |
          cd kernel
          cp -a ../patches/build_kernel.sh .
          cp -a ../patches/droidspaces.config .
          cp -a ../patches/fix_restore_cgroup_file_prefix_handling.cocci .
          cp -a ../patches/fix_kernel_panic_in_xt_qtaguid.cocci .
          cp -a ../patches/kernel/cgroup/cgroup.c kernel/cgroup/cgroup.c
          cp -a ../patches/drivers/bus/mhi/core/mhi_init.c drivers/bus/mhi/core/mhi_init.c
          cp -a ../patches/drivers/input/keyboard/nanosic_driver_v2/nano_macro.h drivers/input/keyboard/nanosic_driver_v2/nano_macro.h

          # ---- sanity checks: 提前失败，避免白跑一次编译 ----
          test -f arch/arm64/configs/lmi_defconfig || { echo "FAIL: lmi_defconfig missing"; exit 1; }
          grep -q -- '-e MILLET' build_kernel.sh || { echo "FAIL: build_kernel.sh 版本不符"; exit 1; }
          grep -q 'Guard against NULL' drivers/bus/mhi/core/mhi_init.c || { echo "FAIL: mhi fix missing"; exit 1; }
          grep -q 'CGRP_ROOT_NOPREFIX' kernel/cgroup/cgroup.c || { echo "FAIL: cgroup fix missing"; exit 1; }
          grep -q 'rawdata_show' drivers/input/keyboard/nanosic_driver_v2/nano_macro.h || { echo "FAIL: nano_macro.h missing"; exit 1; }
          grep -q '^CONFIG_PID_NS=y' droidspaces.config || { echo "FAIL: droidspaces.config missing CONFIG_PID_NS"; exit 1; }
          grep -q 'kernfs_create_link' fix_restore_cgroup_file_prefix_handling.cocci || { echo "FAIL: cgroup cocci fix missing"; exit 1; }
          # lmi_defconfig 现状确认：PID_NS 未开启属预期，靠 droidspaces.config 合并补齐
          grep -c 'CONFIG_PID_NS' arch/arm64/configs/lmi_defconfig || true
          echo "[+] All patches verified OK"

      # 上游 droidspaces.config 只覆盖了 Droidspaces 本体所需项；pipa 之所以能用，
      # 是因为 patch 仓库直接整份替换了 pipa_defconfig（多出 44 项）。lmi 用的是源码仓库
      # 自带 defconfig，所以这里把上游"未被片段覆盖"的 19 项补齐，否则嵌套 Docker 会残废
      # （缺 USER_NS→unsafe procfs、缺 XT_MARK→fwmark 规则、缺 devpts 多实例→PTY 隔离等）
      - name: Extend config fragment for lmi (Docker support)
        run: |
          cat >> kernel/droidspaces.config <<'EOF'

          # --- lmi 补充：对齐 pipa_defconfig 中未被 droidspaces.config 覆盖的项 ---
          CONFIG_USER_NS=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_IP_VS=y
          CONFIG_NETFILTER_XT_MATCH_IPVS=y
          CONFIG_NETFILTER_XT_MARK=y
          CONFIG_MEMCG_SWAP_ENABLED=y
          CONFIG_CGROUP_PERF=y
          CONFIG_CGROUP_HUGETLB=y
          CONFIG_NET_CLS_CGROUP=y
          CONFIG_NFT_CT=y
          CONFIG_NFT_FIB=y
          CONFIG_NFT_MASQ=y
          CONFIG_NFT_NAT=y
          CONFIG_DEVPTS_MULTIPLE_INSTANCES=y
          CONFIG_CGROUP_NS=y
          CONFIG_CHECKPOINT_RESTORE=y
          CONFIG_KCMP=y
          CONFIG_SCHED_AUTOGROUP=y
          EOF
          # ABI 对齐：厂商模块靠 MODVERSIONS 的 CRC 校验加载，而 struct module 的布局
          # 受 MODULE_SIG / JUMP_LABEL 影响。原厂为 MODULE_SIG=y、JUMP_LABEL=n，
          # 本树 defconfig 恰好相反，导致 module_layout 的 CRC 不匹配、模块被拒（实测确认）。
          cat >> kernel/droidspaces.config <<'EOF'
          # --- 使 struct module 与原厂一致，避免 module_layout CRC 不匹配 ---
          CONFIG_MODULE_SIG=y
          CONFIG_MODULE_SIG_ALL=y
          # CONFIG_JUMP_LABEL is not set
          EOF
          grep -q '^CONFIG_USER_NS=y' kernel/droidspaces.config || { echo "FAIL: 补充片段未写入"; exit 1; }
          echo "[+] 片段已扩展到 $(grep -c '^CONFIG_.*=y' kernel/droidspaces.config) 项"

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
            git gnupg gperf imagemagick libncurses-dev \
            lib32readline-dev lib32z1-dev liblz4-tool \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3 coccinelle

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache_mikernel
          key: ${{ runner.os }}-kernel-ccache-lmi-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-lmi-
            ${{ runner.os }}-kernel-ccache-

      - name: Setup zyc-clang 16 Toolchain
        run: |
          mkdir -p $HOME/zyc-clang
          cd $HOME/zyc-clang
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
          tar -zxvf Clang-16.0.6-20260510.tar.gz

      - name: Run Build Script
        working-directory: kernel
        run: |
          chmod +x build_kernel.sh
          # 不带 ksu：ReSukiSU main 分支默认配 tracepoint hook，与 4.19 non-GKI 不兼容
          # （drivers/kernelsu/Kbuild 直接 $(error) 中断）。本机已用 Magisk root，
          # Droidspaces 官方支持 Magisk（需在 App 内开 Daemon Mode），故不引入 KSU。
          echo "Executing: ./build_kernel.sh lmi miui"
          ./build_kernel.sh lmi miui

      - name: Gate - verify real .config (必须直接读 out_miui/.config)
        if: always()
        working-directory: kernel
        run: |
          # MIUI 目标下 kernel/Makefile 会把 lmi_stock-defconfig 伪装成 /proc/config.gz 的内容，
          # 且本树走的是 AOSP 分支的假配置，故镜像内嵌配置完全不可信，只能查真实 .config
          CFG=out_miui/.config
          if [ ! -f "$CFG" ]; then echo "FATAL: $CFG 不存在"; exit 1; fi
          cp "$CFG" "$GITHUB_WORKSPACE/final-lmi.config"
          echo "=== 设备 / MIUI / 本地化相关 ==="
          grep -E '^CONFIG_(LOCALVERSION|XIAOMI_MIUI|MACH_XIAOMI_LMI|SF_BINDER|MIGT|MILLET|MIHW|RTMM|PERF_HELPER|KPERFEVENTS|MODULE_SIG|JUMP_LABEL|MODVERSIONS)=' "$CFG" || true
          echo "--- JUMP_LABEL / MODULE_SIG 是否等于原厂(MODULE_SIG=y, JUMP_LABEL=n) ---"
          grep -E '^(# )?CONFIG_(JUMP_LABEL|MODULE_SIG|MODULE_SIG_ALL)( |$)' "$CFG" || true
          echo "=== 容器关键项 ==="
          grep -E '^CONFIG_(USER_NS|PID_NS|IPC_NS|NET_NS|CGROUP_NS|SYSVIPC|POSIX_MQUEUE|DEVTMPFS|NF_TABLES|NETFILTER_XT_MARK|DEVPTS_MULTIPLE_INSTANCES|CHECKPOINT_RESTORE|SCHED_AUTOGROUP)=' "$CFG" || true
          echo "=== 必需项逐项校验（本树无此符号者记为 N/A，不算失败）==="
          missing=0
          for s in SYSCTL SYSVIPC POSIX_MQUEUE NAMESPACES PID_NS UTS_NS IPC_NS USER_NS NET_NS SECCOMP SECCOMP_FILTER CGROUPS CGROUP_DEVICE CGROUP_PIDS MEMCG CGROUP_SCHED FAIR_GROUP_SCHED CGROUP_FREEZER CGROUP_NET_PRIO DEVTMPFS OVERLAY_FS TMPFS_POSIX_ACL TMPFS_XATTR FW_LOADER FW_LOADER_USER_HELPER FW_LOADER_COMPRESS VETH BRIDGE BRIDGE_NETFILTER NETFILTER_ADVANCED NF_CONNTRACK IP_NF_IPTABLES IP_NF_FILTER NF_NAT NF_TABLES IP_NF_TARGET_MASQUERADE NETFILTER_XT_TARGET_MASQUERADE NETFILTER_XT_TARGET_TCPMSS NETFILTER_XT_MATCH_ADDRTYPE NF_CONNTRACK_NETLINK NF_NAT_REDIRECT IP_ADVANCED_ROUTER IP_MULTIPLE_TABLES IP_NF_NAT IP6_NF_NAT IP6_NF_TARGET_MASQUERADE NETFILTER_XT_MARK NETFILTER_XT_MATCH_IPVS IP_VS MEMCG_SWAP_ENABLED CGROUP_PERF CGROUP_HUGETLB NET_CLS_CGROUP NFT_CT NFT_FIB NFT_MASQ NFT_NAT DEVPTS_MULTIPLE_INSTANCES CGROUP_NS CHECKPOINT_RESTORE KCMP SCHED_AUTOGROUP BLK_DEV_LOOP EXT4_FS; do
            if grep -q "^CONFIG_${s}=y$" "$CFG"; then
              continue
            elif grep -q "^# CONFIG_${s} is not set$" "$CFG"; then
              echo "DISABLED: CONFIG_${s}"
              missing=$((missing+1))
            else
              echo "N/A: CONFIG_${s}（本树无此符号，已与原厂 lmi_stock-defconfig 交叉验证）"
            fi
          done
          echo "真正被禁用的必需项数: $missing"
          [ "$missing" -eq 0 ] || exit 1

      - name: Upload final .config
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: final-lmi-config-${{ github.run_id }}
          path: final-lmi.config
          retention-days: 30

      - name: Show build outputs
        if: always()
        run: |
          echo "--- APTKernel zip ---"
          ls -lh kernel/APTKernel_*.zip 2>/dev/null || echo "(no zip produced)"
          echo "--- zip 内容（AnyKernel3 必须同时含 Image/dtb/dtbo.img）---"
          unzip -l kernel/APTKernel_*.zip 2>/dev/null | grep -E 'kernels/|Image|dtb' || true

      - name: Upload Flashable ZIP
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: APTKernel-lmi-miui-${{ github.run_id }}
          path: kernel/APTKernel_*.zip
          compression-level: 0
          retention-days: 30
